<html>

<head>
  <title>NZCCD Bruun Rule calculations</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.glify@3.3.0/dist/glify-browser.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/spin.js/2.3.2/spin.min.js"></script>
  <script src="https://unpkg.com/leaflet-spin@1.1.0/leaflet.spin.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"
    integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet-geosearch@latest/dist/bundle.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-geosearch@latest/assets/css/leaflet.css">
  <script src="https://unpkg.com/leaflet-providers@1.3.0/leaflet-providers.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"
    integrity="sha512-zInFF17qBFVvvvFpIfeBzo7Tj7+rQxLeTJDmbxjBz5/zIr89YVbTNelNhdTT+/DCrxoVzBeUPVFJsczKbB7sew=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaOtpa48djpNbZHwExddghZ+ZmzWT06R5v6NSk3ZUfsH6FNEDepLx9hPQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  
  <style>
      body,
      html,
      #map {
          width: 100%;
          height: 100%;
          margin: 0;
          padding: 0;
      }

      .legend {
          color: white;
          padding: 10px;
          background-color: rgba(0, 0, 0, 0.8);
          border-radius: 5px;
          max-width: 500px;
      }

      .legend i {
          width: 18px;
          height: 18px;
          float: left;
          margin-right: 8px;
          opacity: 0.7;
          clear: left;
      }

      .legend h4 {
        margin-top: 0px;
      }

      .link {
          text-decoration: underline;
          cursor: pointer;
      }
  </style>
</head>

<body>
  <div id="map"></div>
  <script type="module">
    var map = L.map('map', {
      center: [-42, 172],
      zoom: 6,
      //worldCopyJump: true
    })

    var baseMaps = {
      "OSM": L.tileLayer.provider("OpenStreetMap.Mapnik"),
      "CartoDB Positron": L.tileLayer.provider('CartoDB.Positron'),
      "CartoDB Dark Matter": L.tileLayer.provider("CartoDB.DarkMatter"),
      "ESRI WorldImagery": L.tileLayer.provider("Esri.WorldImagery").addTo(map),
      "Google Hybrid": L.tileLayer('http://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
      })
    }

    var overlayMaps = {
    }

    L.control.layers(baseMaps, overlayMaps, { position: "topleft" }).addTo(map);

    var cmap = chroma.scale('YlOrRd').domain([0, 1000])

    map.spin(true);

    // Helper function to parse CSV with Promise
    function parseCSV(url) {
      return new Promise((resolve, reject) => {
        Papa.parse(url, {
          header: true,
          download: true,
          dynamicTyping: true,
          skipEmptyLines: true,
          complete: function(results) {
            console.log(`Loaded ${url}:`, results.data.length, 'rows');
            resolve(results.data);
          },
          error: function(error) {
            console.error(`Error loading ${url}:`, error);
            reject(error);
          }
        });
      });
    }

    // Load both CSV files simultaneously and initialize map
    async function loadDataAndInitializeMap() {
      try {
        const [bruunruleData, nzSeaRiseData] = await Promise.all([
          parseCSV('bruunrule_JaMoNoRaSoWa_b_10.csv'),
          parseCSV('NZSeaRise_proj_novlm.csv')
        ]);

        window.bruunruleData = bruunruleData
        window.nzSeaRiseData = nzSeaRiseData
        console.log({bruunruleData, nzSeaRiseData})

        var points = bruunruleData.map(r => [parseFloat(r.lat), parseFloat(r.lon)])

        L.glify.points({
          map: map,
          data: points,
          size: 10,
          fragmentShaderSource: L.glify.shader.fragment.simpleCircle,
          sensitivity: 5,
          sensitivityHover: 5,
          color: function(index, point) {
            var r = bruunruleData[index]
            if (!r.R) {
              return {r:0, g:0, b:0}
            }
            var c = cmap(r.R).gl()
            return { r: c[0], g: c[1], b: c[2] };
          },
          click: function (e, point, xy) {
            if (!point) return;
            var i = points.indexOf(point);
            var r = bruunruleData[i];
            console.log(r);
            $("#plot").remove()
            if (window.popup) map.closePopup(window.popup)

            var confidence_level = "medium_confidence"
            var year = 2150
            var percentile = 0.5
            var scenario = 4.5
            var SLR_ID = r["Site ID"]
            var SLR = nzSeaRiseData.find(d => d.site == SLR_ID && d.Confidence == confidence_level && d.year == year && d.scenario == scenario)
            console.log(SLR)
            var R_SLR = SLR[0.5] * r.R
            var ER_SLR = R_SLR / (year - 2020)

            window.popup = L.popup({minWidth: 800})
              //['Unique_ID', 'dist_m', 'mean_dist_to_coast', 'CD', 'B', 'L', 'R', 'tanbeta', 'S_SLR', 'R_SLR', 'ER_SLR', 'lat', 'lon', 'wave_lat', 'wave_lon']
              .setContent(`Unique ID: ${r.Unique_ID}<br>
                Distance to WHACS point: ${r.dist_m.toLocaleString()}m<br>
                Distance to Mean High Water Line: ${r.mean_dist_to_coast.toLocaleString()}m<br>
                Closure Depth (h): ${r.CD.toLocaleString()}m<br>
                Dune height (B): ${r.B.toLocaleString()}m<br>
                Distance from the dune peak to the depth of closure (L): ${r.L.toLocaleString()}m<br>
                Shoreline recession (R): ${r.R.toLocaleString()}m<br>
                tanβ (slope): ${r.tanbeta.toLocaleString()}<br>
                Projected Sea Level Rise at ${year} (S_SLR): p50:${SLR[0.5].toFixed(2)} m (p17:${SLR[0.17]}m - p83:${SLR[0.83]}m)<br>
                Bruun Rule predicted shoreline retreat at ${year} (R_SLR): p50:${(r.R * SLR[0.5]).toLocaleString()} (p17:${(r.R * SLR[0.17]).toLocaleString()}m - p83:${(r.R * SLR[0.83]).toLocaleString()}m)<br>
                Bruun Rule predicted shoreline retreat per year (ER_SLR): ${(r.R * SLR[0.5] / (year - 2020)).toLocaleString()} m/yr (p17:${(r.R * SLR[0.17] / (year - 2020)).toLocaleString()}m/yr - p83:${(r.R * SLR[0.83] / (year - 2020)).toLocaleString()}m/yr)<br>
                WHACS point latitude: ${r.wave_lat}<br>
                WHACS point longitude: ${r.wave_lon}<br>
              `)
              .setLatLng(point)
              .addTo(map);
          },
        });
        map.spin(false);
      } catch (error) {
        console.error('Failed to load data:', error);
        map.spin(false);
      }
    }

    // Start loading data
    loadDataAndInitializeMap();

    var geoSearch = new GeoSearch.GeoSearchControl({
      provider: new GeoSearch.OpenStreetMapProvider(),
      style: 'button',
      autoComplete: true,
      autoCompleteDelay: 250,
      autoClose: true,
      position: "topleft"
    }).addTo(map);

    var legend = L.control({ position: 'bottomright' });

    legend.onAdd = function (map) {
      var div = L.DomUtil.create('div', 'info legend');
      div.innerHTML += "<h4>Bruun retreat (m)</h4>"
      for (var i = 0; i <= 1000; i += 200) {
        div.innerHTML += `<i style="background:${cmap(i).css()}"></i>${i}<br>`
      }
      div.innerHTML += `<i style="background:black"></i>Uncertain<br>`
      return div;
    };

    legend.addTo(map);
  </script>
</body>

</html>
