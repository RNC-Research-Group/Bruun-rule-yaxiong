<html>

<head>
  <title>NZCCD Bruun Rule calculations</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.glify@3.3.0/dist/glify-browser.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/spin.js/2.3.2/spin.min.js"></script>
  <script src="https://unpkg.com/leaflet-spin@1.1.0/leaflet.spin.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"
    integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet-geosearch@latest/dist/bundle.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-geosearch@latest/assets/css/leaflet.css">
  <script src="https://unpkg.com/leaflet-providers@1.3.0/leaflet-providers.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"
    integrity="sha512-zInFF17qBFVvvvFpIfeBzo7Tj7+rQxLeTJDmbxjBz5/zIr89YVbTNelNhdTT+/DCrxoVzBeUPVFJsczKbB7sew=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaOtpa48djpNbZHwExddghZ+ZmzWT06R5v6NSk3ZUfsH6FNEDepLx9hPQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.3/dist/leaflet.draw.css" />
  <script src="https://unpkg.com/leaflet-draw@1.0.3/dist/leaflet.draw.js"></script>
  <link rel="stylesheet" href="https://prominentedge.com/leaflet-measure-path/leaflet-measure-path.css" />
  <script src="https://prominentedge.com/leaflet-measure-path/leaflet-measure-path.js"></script>
  
  <style>
      body,
      html,
      #map {
          width: 100%;
          height: 100%;
          margin: 0;
          padding: 0;
      }

      .legend {
          color: white;
          padding: 10px;
          background-color: rgba(0, 0, 0, 0.8);
          border-radius: 5px;
          max-width: 500px;
      }

      .legend i {
          width: 18px;
          height: 18px;
          float: left;
          margin-right: 8px;
          opacity: 0.7;
          clear: left;
      }

      .legend h4 {
        margin-top: 0px;
      }

      .link {
          text-decoration: underline;
          cursor: pointer;
      }

        .scenario-control {
          background-color: rgba(0, 0, 0, 0.8);
          color: white;
          padding: 10px;
          border-radius: 5px;
          min-width: 180px;
        }

        .scenario-control label {
          display: block;
          margin-bottom: 6px;
          font-weight: bold;
        }

        .scenario-control select {
          width: 100%;
          padding: 4px;
        }
  </style>
</head>

<body>
  <div id="map"></div>
  <script>
    if (typeof proj4 === 'function' && !proj4.defs('EPSG:2193')) {
      proj4.defs('EPSG:2193', '+proj=tmerc +lat_0=0 +lon_0=173 +k=0.9996 +x_0=1600000 +y_0=10000000 +ellps=GRS80 +units=m +no_defs')
    }

    var map = L.map('map', {
      center: [-42, 172],
      zoom: 6,
      //worldCopyJump: true
    })

    var baseMaps = {
      "OSM": L.tileLayer.provider("OpenStreetMap.Mapnik"),
      "CartoDB Positron": L.tileLayer.provider('CartoDB.Positron'),
      "CartoDB Dark Matter": L.tileLayer.provider("CartoDB.DarkMatter"),
      "ESRI WorldImagery": L.tileLayer.provider("Esri.WorldImagery").addTo(map),
      "Google Hybrid": L.tileLayer('http://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
      })
    }


    var editableLayers = new L.FeatureGroup();
    map.addLayer(editableLayers);

    var options = {
        position: 'topleft',
        draw: {
            polyline: {
                shapeOptions: {
                    color: '#f357a1',
                }
            },
            polygon: {
                allowIntersection: true, // Restricts shapes to simple polygons
                shapeOptions: {
                    color: '#bada55'
                },
                showArea: true,
                showLength: true,
            },
            rectangle: {
                showArea: true,
                metric: ["km"],
            },
        },
        edit: {
            featureGroup: editableLayers, //REQUIRED!!
            remove: true
        }
    };

    var drawControl = new L.Control.Draw(options);
    map.addControl(drawControl);

    map.on(L.Draw.Event.CREATED, function (e) {
        console.log("created", e)
        var type = e.layerType,
            layer = e.layer;
        layer.type = type;

        if (type === 'marker') {
            layer.bindPopup('A popup!');
        }

        layer.addTo(editableLayers)
        if (type == "polyline") layer.showMeasurements()
    });
    map.on(L.Draw.Event.EDITSTART, function () {
        console.log("editstart");
        var drawBounds = editableLayers.getBounds();
        if (!map.getBounds().contains(drawBounds)) {
            map.flyToBounds(drawBounds);
        }
    });
    map.on(L.Draw.Event.EDITED, function (e) {
        console.log("edited", e)
        e.layers.eachLayer(function (layer) {
            if (layer.type == "polyline") layer.updateMeasurements()
        })
    });

    var overlayMaps = {
      "Drawn Items": editableLayers
    }

    var layerControl = L.control.layers(baseMaps, overlayMaps, { position: "topleft" }).addTo(map);

    var legendDiv = null

    map.spin(true);

    var SCENARIOS = ['1.9', '2.6', '4.5', '7.0', '8.5']
    var SCENARIO_COLORS = {
      '1.9': '#1b7837',
      '2.6': '#4dac26',
      '4.5': '#f4a736',
      '7.0': '#e08214',
      '8.5': '#b2182b'
    }
    var activeScenarios = new Set(['2.6'])
    var activeYear = '2100'
    var joinThresholdM = 10
    var scenarioLayers = {}
    SCENARIOS.forEach(function(s) {
      scenarioLayers[s] = {
        line: L.layerGroup().addTo(map),
        uncertainty: L.layerGroup().addTo(map)
      }
      layerControl.addOverlay(scenarioLayers[s].line, 'Scenario ' + s + ' shoreline (p0.5)')
      layerControl.addOverlay(scenarioLayers[s].uncertainty, 'Scenario ' + s + ' uncertainty (p0.17/p0.83)')
    })
    var csvCache = {}

    function buildCsvPath(year, scenario, percentile) {
      return `output/bruunrule/NZ_medium_confidence_y${year}_s${scenario}_p${percentile}.csv`
    }

    var scenarioControl = L.control({ position: 'topright' });
    scenarioControl.onAdd = function () {
      var div = L.DomUtil.create('div', 'scenario-control');
      var checkboxesHtml = SCENARIOS.map(s => `
        <label style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-weight:normal;">
          <input type="checkbox" class="scenario-cb" value="${s}" ${s === '2.6' ? 'checked' : ''}>
          <span style="display:inline-block;width:14px;height:3px;background:${SCENARIO_COLORS[s]};border-radius:2px;"></span>
          SSP${s}
        </label>`).join('');
      div.innerHTML = `
        <label for="year-select">Year</label>
        <select id="year-select">
          <option value="2050">2050</option>
          <option value="2100" selected>2100</option>
          <option value="2150">2150</option>
        </select>
        <label style="margin-top:10px;display:block;">Scenarios</label>
        ${checkboxesHtml}
      `;
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.on(div.querySelector('#year-select'), 'change', function (e) {
        activeYear = e.target.value;
        renderAllActiveScenarios().catch(function(err) { console.error('render error:', err); });
      });
      div.querySelectorAll('.scenario-cb').forEach(function(cb) {
        L.DomEvent.on(cb, 'change', function () {
          if (cb.checked) {
            activeScenarios.add(cb.value);
            renderScenario(activeYear, cb.value).catch(function(err) { console.error('render error:', err); });
          } else {
            activeScenarios.delete(cb.value);
            clearScenario(cb.value);
          }
          refreshLegend();
        });
      });
      return div;
    };
    scenarioControl.addTo(map);

    // Helper function to parse CSV with Promise
    function parseCSV(url) {
      return new Promise((resolve, reject) => {
        Papa.parse(url, {
          header: true,
          download: true,
          dynamicTyping: true,
          skipEmptyLines: true,
          complete: function(results) {
            console.log(`Loaded ${url}:`, results.data.length, 'rows');
            resolve(results.data);
          },
          error: function(error) {
            console.error(`Error loading ${url}:`, error);
            reject(error);
          }
        });
      });
    }

    function refreshLegend() {
      if (!legendDiv) return;
      legendDiv.innerHTML = '<h4>Scenarios (' + activeYear + ')</h4>';
      SCENARIOS.forEach(function(s) {
        var active = activeScenarios.has(s);
        legendDiv.innerHTML += `<div style="opacity:${active ? 1 : 0.35};display:flex;align-items:center;gap:6px;margin-bottom:3px;">`
          + `<i style="background:${SCENARIO_COLORS[s]};height:3px;width:18px;display:inline-block;border-radius:2px;"></i>`
          + `SSP${s}</div>`;
      });
      legendDiv.innerHTML += '<div style="margin-top:8px;"><span style="display:inline-block;width:16px;border-top:2px dashed #5DADE2;vertical-align:middle;margin-right:6px;"></span>Uncertainty (p0.17/p0.83)</div>';
    }

    function quantile(sortedValues, q) {
      if (!sortedValues.length) return 0;
      var pos = (sortedValues.length - 1) * q;
      var base = Math.floor(pos);
      var rest = pos - base;
      if ((sortedValues[base + 1] !== undefined)) {
        return sortedValues[base] + rest * (sortedValues[base + 1] - sortedValues[base]);
      }
      return sortedValues[base];
    }



    async function loadDataset(year, scenario, percentile) {
      var key = `${year}|${scenario}|${percentile}`
      if (csvCache[key]) return csvCache[key]
      var path = buildCsvPath(year, scenario, percentile)
      var rows = await parseCSV(path)
      csvCache[key] = rows
      return rows
    }

    function rowId(row) {
      return String(row.Unique_ID)
    }

    function parseValidNzLatLon(latValue, lonValue) {
      if (latValue === null || latValue === undefined || latValue === '') return null
      if (lonValue === null || lonValue === undefined || lonValue === '') return null
      var lat = Number(latValue)
      var lon = Number(lonValue)
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null
      // Keep map strictly around NZ to avoid stray 0,0 or malformed points.
      if (lat < -55 || lat > -25 || lon < 160 || lon > 190) return null
      return { lat: lat, lon: lon }
    }

    function shorelineLatLon(row) {
      // Plot shoreline points from shoreline lat/lon columns.
      // point_X/point_Y are projected coordinates and need CRS metadata to convert reliably.
      return parseValidNzLatLon(row.lat, row.lon) || parseValidNzLatLon(row.proj_lat, row.proj_lon)
    }

    function historicRetreatRateFromWlr(row) {
      var wlr = Number(row.WLR)
      if (Number.isFinite(wlr)) return wlr
      return NaN
    }

    function buildProjectedRuns(rows, rateField) {
      var validRows = rows.filter(r =>
        Number.isFinite(r.proj_lat) && Number.isFinite(r.proj_lon) &&
        Number.isFinite(r.proj_point_X) && Number.isFinite(r.proj_point_Y) &&
        Number.isFinite(r.point_X) && Number.isFinite(r.point_Y)
      )

      if (!validRows.length) return []

      var cell = joinThresholdM + 0.5
      var buckets = new Map()
      var maxNearest = 3

      function bucketKey(ix, iy) {
        return `${ix}|${iy}`
      }

      for (var i = 0; i < validRows.length; i++) {
        var x = Number(validRows[i].point_X)
        var y = Number(validRows[i].point_Y)
        var ix = Math.floor(x / cell)
        var iy = Math.floor(y / cell)
        var key = bucketKey(ix, iy)
        if (!buckets.has(key)) buckets.set(key, [])
        buckets.get(key).push(i)
      }

      var nearest = Array.from({ length: validRows.length }, () => [])
      for (var i = 0; i < validRows.length; i++) {
        var xi = Number(validRows[i].point_X)
        var yi = Number(validRows[i].point_Y)
        var iix = Math.floor(xi / cell)
        var iiy = Math.floor(yi / cell)
        var candidatesForI = []

        for (var dxCell = -1; dxCell <= 1; dxCell++) {
          for (var dyCell = -1; dyCell <= 1; dyCell++) {
            var key = bucketKey(iix + dxCell, iiy + dyCell)
            var candidates = buckets.get(key) || []
            for (var c = 0; c < candidates.length; c++) {
              var j = candidates[c]
              if (j === i) continue
              var xj = Number(validRows[j].point_X)
              var yj = Number(validRows[j].point_Y)
              var d = Math.hypot(xi - xj, yi - yj)
              if (Number.isFinite(d) && d <= cell) {
                candidatesForI.push({ j: j, d: d })
              }
            }
          }
        }

        // Filter by transect orientation: only join if vectors point similarly (dot product > 0.7).
        var uxi = Number(validRows[i].ux1)
        var uyi = Number(validRows[i].uy1)
        if (Number.isFinite(uxi) && Number.isFinite(uyi)) {
          candidatesForI = candidatesForI.filter(item => {
            var uxj = Number(validRows[item.j].ux1)
            var uyj = Number(validRows[item.j].uy1)
            if (!Number.isFinite(uxj) || !Number.isFinite(uyj)) return true
            var dotprod = uxi * uxj + uyi * uyj
            return dotprod > 0.7
          })
        }

        candidatesForI.sort((a, b) => a.d - b.d)
        nearest[i] = candidatesForI.slice(0, maxNearest)
      }

      var nearestSet = nearest.map(list => {
        var s = new Set()
        list.forEach(item => s.add(item.j))
        return s
      })

      // Keep only mutual-nearest candidates to reduce cross-links in curved sections.
      var candidateEdges = []
      for (var i = 0; i < validRows.length; i++) {
        for (var c = 0; c < nearest[i].length; c++) {
          var j = nearest[i][c].j
          var d = nearest[i][c].d
          if (j <= i) continue
          if (nearestSet[j].has(i)) {
            candidateEdges.push({ i: i, j: j, d: d })
          }
        }
      }

      candidateEdges.sort((a, b) => a.d - b.d)

      var adjacency = Array.from({ length: validRows.length }, () => new Set())
      var degree = new Array(validRows.length).fill(0)

      // Enforce max degree 2 so each point joins at most two neighbors (chain-like geometry).
      for (var e = 0; e < candidateEdges.length; e++) {
        var edge = candidateEdges[e]
        if (degree[edge.i] >= 2 || degree[edge.j] >= 2) continue
        adjacency[edge.i].add(edge.j)
        adjacency[edge.j].add(edge.i)
        degree[edge.i] += 1
        degree[edge.j] += 1
      }

      var visited = new Array(validRows.length).fill(false)
      var runs = []

      for (var i = 0; i < validRows.length; i++) {
        if (visited[i] || adjacency[i].size === 0) continue
        var stack = [i]
        visited[i] = true
        var component = []

        while (stack.length) {
          var n = stack.pop()
          component.push(n)
          var nbrs = Array.from(adjacency[n])
          for (var k = 0; k < nbrs.length; k++) {
            var nb = nbrs[k]
            if (!visited[nb]) {
              visited[nb] = true
              stack.push(nb)
            }
          }
        }

        if (component.length < 2) continue

        var componentSet = new Set(component)
        var endpoints = component.filter(idx => {
          var degInComp = 0
          adjacency[idx].forEach(nb => {
            if (componentSet.has(nb)) degInComp += 1
          })
          return degInComp === 1
        })

        var start = endpoints.length ? endpoints[0] : component[0]
        var ordered = []
        var used = new Set()
        var prev = null
        var cur = start

        while (cur !== null && !used.has(cur)) {
          ordered.push(cur)
          used.add(cur)
          var next = null
          var nbrs = Array.from(adjacency[cur]).filter(nb => componentSet.has(nb) && !used.has(nb))
          if (nbrs.length === 1) {
            next = nbrs[0]
          } else if (nbrs.length > 1) {
            if (prev !== null) {
              next = nbrs.find(nb => nb !== prev) ?? nbrs[0]
            } else {
              next = nbrs[0]
            }
          }
          prev = cur
          cur = next
        }

        if (ordered.length < 2) continue

        var coords = []
        var rates = []
        var ids = []
        for (var c = 0; c < ordered.length; c++) {
          var idx = ordered[c]
          coords.push([Number(validRows[idx].proj_lat), Number(validRows[idx].proj_lon)])
          rates.push(Number(validRows[idx][rateField]))
          ids.push(rowId(validRows[idx]))
        }

        var finiteRates = rates.filter(v => Number.isFinite(v))
        var meanRate = finiteRates.length
          ? finiteRates.reduce((s, v) => s + v, 0) / finiteRates.length
          : NaN

        var historicRetreatRates = []
        for (var h = 0; h < ordered.length; h++) {
          var histRate = historicRetreatRateFromWlr(validRows[ordered[h]])
          if (Number.isFinite(histRate)) historicRetreatRates.push(histRate)
        }
        var meanHistoricRetreatRate = historicRetreatRates.length
          ? historicRetreatRates.reduce((s, v) => s + v, 0) / historicRetreatRates.length
          : NaN

        runs.push({
          coords: coords,
          meanRate: meanRate,
          meanHistoricRetreatRate: meanHistoricRetreatRate,
          ids: ids,
        })
      }

      return runs
    }

    function buildRowLookup(rows) {
      var m = new Map()
      rows.forEach(r => m.set(rowId(r), r))
      return m
    }

    function coordsFromRunIds(ids, lookup) {
      var coords = []
      for (var i = 0; i < ids.length; i++) {
        var r = lookup.get(ids[i])
        if (!r) continue
        if (Number.isFinite(r.proj_lat) && Number.isFinite(r.proj_lon)) {
          coords.push([Number(r.proj_lat), Number(r.proj_lon)])
        }
      }
      return coords
    }

    function clearScenario(scenario) {
      scenarioLayers[scenario].line.clearLayers()
      scenarioLayers[scenario].uncertainty.clearLayers()
    }

    async function renderScenario(year, scenario) {
      clearScenario(scenario)
      var color = SCENARIO_COLORS[scenario]
      console.log(`renderScenario: Loading year=${year}, scenario=${scenario}`);

      var rows50 = await loadDataset(year, scenario, '0.5')
      console.log(`renderScenario: Loaded ${rows50.length} rows for y${year}_s${scenario}`);

      // Render individual points as circle markers
      var pointsAdded = 0
      rows50.forEach(function(row) {
        var latLon = shorelineLatLon(row)
        var rate = Number(row.R_SLR_rate)
        var wlr = Number(row.WLR)
        var totalRetreat = rate * (Number(year) - 2020)
        var B = Number(row.B)
        var CD = Number(row.CD)
        var profileLength = Number(row.L)

        if (latLon) {
          var marker = L.circleMarker([latLon.lat, latLon.lon], {
            radius: 4,
            fillColor: color,
            color: color,
            weight: 1,
            opacity: 0.9,
            fillOpacity: 0.8
          })

          var popupContent = `<b>Scenario:</b> SSP${scenario}<br>` +
            `<b>Year:</b> ${year}<br>` +
            `<b>Projected retreat rate:</b> ${Number.isFinite(rate) ? rate.toFixed(3) : 'n/a'} m/yr<br>` +
            `<b>Total retreat:</b> ${Number.isFinite(totalRetreat) ? totalRetreat.toFixed(2) : 'n/a'} m<br>` +
            `<b>Historic retreat rate:</b> ${Number.isFinite(wlr) ? wlr.toFixed(3) : 'n/a'} m/yr<br>` +
            `<b>Dune height (B):</b> ${Number.isFinite(B) ? B.toFixed(2) : 'n/a'} m<br>` +
            `<b>Closure depth (CD):</b> ${Number.isFinite(CD) ? CD.toFixed(2) : 'n/a'} m<br>` +
            `<b>Profile length (L):</b> ${Number.isFinite(profileLength) ? profileLength.toFixed(2) : 'n/a'} m`

          marker.bindPopup(popupContent)
          scenarioLayers[scenario].line.addLayer(marker)
          pointsAdded++
        }
      })
      console.log(`renderScenario: Added ${pointsAdded} points for y${year}_s${scenario}`);
    }

    async function renderAllActiveScenarios() {
      if (window.popup) map.closePopup(window.popup)
      await Promise.all(Array.from(activeScenarios).map(s => renderScenario(activeYear, s)))
      // Clear inactive scenarios
      SCENARIOS.forEach(function(s) {
        if (!activeScenarios.has(s)) clearScenario(s)
      })
      refreshLegend()
      // Build bounds from actual marker layers to avoid LayerGroup getLatLng errors.
      var combinedBounds = L.latLngBounds()
      SCENARIOS.forEach(function(s) {
        scenarioLayers[s].line.eachLayer(function(layer) {
          if (layer && typeof layer.getLatLng === 'function') {
            combinedBounds.extend(layer.getLatLng())
          }
        })
      })
      if (combinedBounds.isValid()) {
        map.fitBounds(combinedBounds, { padding: [20, 20] })
      }
    }

    // Load selected Step 5 CSV and initialize map
    async function loadDataAndInitializeMap() {
      try {
        console.log('Starting to load data...');
        await renderAllActiveScenarios()
        console.log('Data loaded successfully');
        map.spin(false);
      } catch (error) {
        console.error('Failed to load data:', error);
        alert('Error loading data: ' + error.message);
        map.spin(false);
      }
    }

    // Start loading data
    console.log('Initializing map...');
    loadDataAndInitializeMap();

    var geoSearch = new GeoSearch.GeoSearchControl({
      provider: new GeoSearch.OpenStreetMapProvider(),
      style: 'button',
      autoComplete: true,
      autoCompleteDelay: 250,
      autoClose: true,
      position: "topleft"
    }).addTo(map);

    var legend = L.control({ position: 'bottomright' });

    legend.onAdd = function (map) {
      legendDiv = L.DomUtil.create('div', 'info legend');
      legendDiv.innerHTML = '<h4>Scenarios</h4>';
      return legendDiv;
    };

    legend.addTo(map);
  </script>
</body>

</html>
